<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Минималистичное судоку с уровнями сложности">
  <meta name="theme-color" content="#fafaf9" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#111113" media="(prefers-color-scheme: dark)">
  <title>Судоку</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <header class="top">
      <h1>Судоку</h1>
      <button class="link-btn" id="new-game" type="button">Новая игра</button>
    </header>

    <nav class="levels" id="levels" aria-label="Уровень сложности"></nav>

    <div class="status">
      <span id="mistakes">Ошибки: 0</span>
      <span id="timer" aria-label="Время">00:00</span>
    </div>

    <div class="board" id="board" role="grid" aria-label="Поле судоку"></div>

    <div class="tools">
      <button class="tool" id="undo" type="button" title="Отменить (Ctrl+Z)">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg>
        <span>Отменить</span>
      </button>
      <button class="tool" id="erase" type="button" title="Стереть (Backspace)">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 20H8l-4-4a2 2 0 0 1 0-2.8l9.2-9.2a2 2 0 0 1 2.8 0l4 4a2 2 0 0 1 0 2.8L13 20"/><path d="m9 9 7 7"/></svg>
        <span>Стереть</span>
      </button>
      <button class="tool" id="notes" type="button" title="Заметки (N)" aria-pressed="false">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>
        <span>Заметки</span>
        <em class="badge" id="notes-badge">выкл</em>
      </button>
      <button class="tool" id="hint" type="button" title="Подсказка (H)">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 18h6"/><path d="M10 22h4"/><path d="M12 2a7 7 0 0 0-4 12.7c.6.5 1 1.3 1 2.3h6c0-1 .4-1.8 1-2.3A7 7 0 0 0 12 2Z"/></svg>
        <span>Подсказка</span>
      </button>
    </div>

    <div class="numpad" id="numpad"></div>
  </main>

  <div class="overlay" id="win" hidden>
    <div class="dialog" role="dialog" aria-modal="true" aria-labelledby="win-title">
      <h2 id="win-title">Решено!</h2>
      <p id="win-text"></p>
      <button class="primary" id="win-new" type="button">Новая игра</button>
    </div>
  </div>

  <script src="sudoku.js"></script>
  <script src="app.js"></script>
</body>
</html>
